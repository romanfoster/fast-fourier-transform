[project]
name = "fast-fourier-transform"
version = "0.1.0"
description = "Radix-2 Cooley-Tukey FFT over complex numbers from the cmath module for convolution and polynomial multiplication."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
